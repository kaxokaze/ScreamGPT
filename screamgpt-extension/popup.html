<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ScreamGPT</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app" id="appRoot">
    <header class="topbar">
      <img class="brand-icon" src="icons/icon48.png" width="42" height="42" alt="" aria-hidden="true">
      <div class="brand-copy">
        <h1>ScreamGPT</h1>
        <p>Let her scream when she’s done.</p>
      </div>
      <label class="switch" title="Enable or mute completion sounds">
        <input id="enabledToggle" type="checkbox" aria-label="Enable completion sounds">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
      </label>
    </header>

    <section class="sound-section" aria-labelledby="soundLabel">
      <div class="section-heading">
        <h2 id="soundLabel">Completion sound</h2>
        <span class="count-label">8 sounds</span>
      </div>
      <div class="picker-anchor">
        <button class="sound-picker" id="soundPickerButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="soundMenu">
          <span class="picker-sound-icon" id="pickerSoundIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 10v4m4-8v12m4-15v18m4-13v8m4-11v14"/></svg>
          </span>
          <span class="picker-copy">
            <strong id="selectedSoundName">Soft Chime</strong>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </button>
        <button class="picker-preview" id="quickPreviewButton" type="button" aria-label="Preview selected sound" title="Preview selected sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7z"/></svg>
        </button>
        <div class="sound-menu" id="soundMenu" role="listbox" aria-label="Completion sounds" hidden></div>
      </div>

      <div class="custom-row">
        <span class="custom-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 14.5V19h14v-4.5"/></svg>
        </span>
        <span class="custom-copy">
          <strong>Custom sound</strong>
          <small id="fileStatus">MP3 or WAV · up to 20 MB</small>
        </span>
        <label class="choose-button" for="customAudio" tabindex="0">Choose</label>
        <input id="customAudio" class="visually-hidden" type="file" accept="audio/mpeg,audio/mp3,audio/wav,audio/x-wav,.mp3,.wav" aria-label="Choose a custom MP3 or WAV audio file">
      </div>
      <button class="remove-link" id="removeCustomButton" type="button" hidden>Remove custom sound</button>
    </section>

    <section class="volume-section" aria-labelledby="volumeLabel">
      <div class="section-heading compact-heading">
        <h2 id="volumeLabel">Volume</h2>
        <output class="volume-value" id="volumeValue" for="volumeSlider">80%</output>
      </div>
      <div class="slider-line">
        <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></svg>
        <input id="volumeSlider" type="range" min="0" max="100" step="5" value="80" aria-label="Completion sound volume" aria-valuetext="80 percent">
        <svg class="volume-icon volume-icon-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></svg>
      </div>
    </section>

    <button id="testButton" class="primary-button" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7z"/></svg>
      <span>Test sound</span>
    </button>
    <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>

    <details class="accessibility" id="accessibilityDetails">
      <summary>
        <span class="accessibility-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M4 8.5h16M12 8.5v11m0-6-5 6m5-6 5 6"/></svg></span>
        <span class="accessibility-copy"><strong>Accessibility</strong></span>
        <svg class="summary-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </summary>
      <div class="setting-list">
        <label class="setting-row" for="largeTextToggle">
          <span><strong>Larger text</strong><small>Increase interface text size</small></span>
          <input class="small-toggle" id="largeTextToggle" type="checkbox">
        </label>
        <label class="setting-row" for="contrastToggle">
          <span><strong>High contrast</strong><small>Stronger text and borders</small></span>
          <input class="small-toggle" id="contrastToggle" type="checkbox">
        </label>
        <label class="setting-row" for="motionToggle">
          <span><strong>Reduced motion</strong><small>Limit interface animations</small></span>
          <input class="small-toggle" id="motionToggle" type="checkbox">
        </label>
        <label class="setting-row" for="keyboardToggle">
          <span><strong>Keyboard navigation</strong><small>Use arrow keys in the sound list</small></span>
          <input class="small-toggle" id="keyboardToggle" type="checkbox">
        </label>
      </div>
    </details>

    <footer class="footer">
      <a href="https://github.com/kaxokaze" target="_blank" rel="noreferrer" aria-label="Open the creator’s personal GitHub profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.67-3.75-1.32-3.75-1.32-.5-1.3-1.24-1.65-1.24-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.17 1.73 1.17 1 1.72 2.62 1.22 3.26.94.1-.73.39-1.22.71-1.5-2.47-.28-5.07-1.24-5.07-5.5 0-1.22.44-2.22 1.16-3-.12-.29-.5-1.43.11-2.98 0 0 .95-.3 3.05 1.15a10.6 10.6 0 0 1 5.56 0c2.1-1.45 3.04-1.15 3.04-1.15.61 1.55.23 2.69.12 2.98.72.78 1.15 1.78 1.15 3 0 4.27-2.6 5.22-5.08 5.5.4.35.76 1.02.76 2.06v3.09c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
        <span>GitHub</span>
        <svg class="external-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6m-1-5-9 9M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>
      </a>
    </footer>
  </main>
  <script src="defaults.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
